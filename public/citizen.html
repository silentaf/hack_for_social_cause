<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RakshaGrid — Need Help?</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="header">
    <h1>🛡️ RakshaGrid</h1>
    <div class="nav-links">
      <a href="index.html" data-i18n="nav_home">Home</a>
      <a href="dashboard.html" data-i18n="nav_dashboard">Control Room</a>
      <a href="#" onclick="toggleLang();return false;" id="langToggle" style="font-weight:600;">हिंदी</a>
    </div>
  </div>

  <div class="citizen-wrap">
    <div class="field">
      <label for="zoneSelect" data-i18n="zone_label">Where are you right now?</label>
      <select id="zoneSelect"></select>
    </div>

    <div id="riskBanner"></div>

    <div id="typeChoice">
      <button class="big-btn medical" onclick="chooseType('medical')">
        <span class="icon">🚑</span> <span data-i18n="btn_medical">Medical Emergency</span>
      </button>
      <button class="big-btn lost" onclick="chooseType('lost_person')">
        <span class="icon">🔎</span> <span data-i18n="btn_lost">Report Lost Person</span>
      </button>
      <button class="big-btn help" onclick="chooseType('help')">
        <span class="icon">🙋</span> <span data-i18n="btn_help">General Help</span>
      </button>
    </div>

    <div id="formWrap" style="display:none;">
      <h2 style="font-size:16px;" id="formTitle"></h2>
      <div class="field">
        <label data-i18n="label_name">Your name</label>
        <input id="fName" type="text" data-i18n-placeholder="ph_name" placeholder="Full name" />
      </div>
      <div class="field">
        <label data-i18n="label_phone">Phone number</label>
        <input id="fPhone" type="tel" data-i18n-placeholder="ph_phone" placeholder="10-digit mobile number" />
      </div>
      <div class="field">
        <label data-i18n="label_desc">Details (optional)</label>
        <textarea id="fDesc" rows="3" data-i18n-placeholder="ph_desc" placeholder="Any helpful detail — description, symptoms, last seen location..."></textarea>
      </div>
      <button class="btn" onclick="submitSos()" data-i18n="btn_submit">Submit Request</button>
      <button class="btn secondary" onclick="resetForm()" data-i18n="btn_back">Back</button>
    </div>

    <div id="confirmWrap" style="display:none;"></div>
  </div>

  <script src="js/citizen.js"></script>
</body>
</html>
